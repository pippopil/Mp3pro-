# Настройки сборщика Gradle для MP3PlayerPro
# Внимание: Сборка требует стабильный JDK 17 (или JDK 21). Не используйте JDK 25!
# Если вы видите ошибку: "Unsupported class file major version 69" — в Android Studio откройте:
# Settings -> Build, Execution, Deployment -> Build Tools -> Gradle -> Gradle JDK -> выберите Embedded JDK (jbr-17).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
